.node-template:
  image: node:26.12.0@sha256:1b84b89ada025e3b14543cbb837ffaa1c1b5273b841c5b94dd1a8f9c1d8cf7fe
  variables:
    # the pnpm install script needs a supported shell to set up pnpm
    SHELL: /bin/bash
    # official pnpm install script (https://get.pnpm.io/install.sh), pinned to a commit of pnpm/get.pnpm.io
    PNPM_INSTALL_SCRIPT: https://raw.githubusercontent.com/pnpm/get.pnpm.io/29fc8463b5b8fb84ad809d9956a40de03877b089/install.sh
  before_script:
    # install the pnpm version pinned in the packageManager field of package.json
    - export PNPM_HOME="$HOME/.local/share/pnpm"
    - export PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
    - curl -fsSL "$PNPM_INSTALL_SCRIPT" | sh -
    - export PATH="$PNPM_HOME/bin:$PATH"

include:
  - local: .gitlab/workflows/tests.yml
  - local: .gitlab/workflows/docker.yml
  - local: .gitlab/workflows/deploy.yml
