minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43830
strictPeerDependencies: true
shellEmulator: true
engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  unrs-resolver: false
  vue-demi: true
minimumReleaseAgeExclude:
  # Renovate security update: nuxt@4.6.3
  - nuxt@4.6.3
