build-gitlab-page:
  extends: .node-template
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pnpm install
    - pnpm build --preset gitlab_pages
  artifacts:
    paths:
      - ./.output/public

deploy:
  # only publishes the artifact of build-gitlab-page, so the pnpm setup of .node-template is not needed
  image: !reference [.node-template, image]
  needs:
    - build-gitlab-page
  script:
    # publish the build output directly; moving it to ./public would nest it into the repository's public/ directory
    - echo "Deploying .output/public to GitLab Pages"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  pages:
    publish: .output/public
